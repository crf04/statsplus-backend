name: Tests

# master has strict branch protection (required checks `checks` and
# `integration`, branch must be up to date), so the pull request run already
# tested the exact tree that gets merged. A push run of the suite would repeat
# it. The one push that still runs is a change to the files that key the
# caches below: a cache saved on a pull request ref is unreadable by other pull
# requests, so master has to save it for them.
on:
  pull_request:
  push:
    branches:
      - master
      - main
    paths:
      - requirements-lock.txt
      - runtime.txt
      - scripts/bootstrap.sh
      - .github/workflows/tests.yml

# Superseded runs on the same ref are cancelled so a rapid series of pushes
# does not queue redundant jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job sets up the interpreter the same way: the exact CPython from
# runtime.txt is restored into the runner's tool cache (the hosted image only
# carries the newest patch of each minor, so setup-python would otherwise
# download and unpack it every run), then the whole virtual environment is
# restored and bootstrap verifies it. With every pinned, hashed requirement
# already installed bootstrap only verifies, so a cached venv and a fresh one
# hold identical versions. setup-python's own pip cache is not used: the venv
# cache already holds the installed packages, and restoring the wheel cache
# beside it cost about six seconds per job for nothing.
jobs:
  # The suite runs as three parallel shards (a crc32 of the test node id picks
  # the shard, see tests/conftest.py). Each uploads its coverage data; `checks`
  # combines it and enforces the floor.
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CHECK_MODE: shard
      STATSPLUS_TEST_SHARD: ${{ matrix.shard }}/3
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.shard${{ matrix.shard }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The injury-report backtest tests count status cells with pdftotext and
      # fail (rather than skip) when it is missing. apt works while the Python
      # steps below restore their caches; the shard waits for it before pytest.
      - name: Start installing poppler-utils
        run: |
          (
            set +e
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
            echo $? > /tmp/poppler-utils.status
          ) > /tmp/poppler-utils.log 2>&1 &

      - name: Read supported Python version
        id: runtime
        shell: bash
        run: |
          version="$(sed -n '1s/^python-//p' runtime.txt | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.runtime.outputs.version }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}

      - name: Restore virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.runtime.outputs.version }}-${{ hashFiles('requirements-lock.txt', 'scripts/bootstrap.sh') }}

      - name: Bootstrap development environment
        run: ./scripts/bootstrap.sh

      - name: Wait for poppler-utils
        run: |
          for _ in $(seq 1 180); do
            [[ -f /tmp/poppler-utils.status ]] && break
            sleep 1
          done
          cat /tmp/poppler-utils.log
          [[ "$(cat /tmp/poppler-utils.status)" == 0 ]]
          command -v pdftotext

      - name: Run this shard
        run: ./scripts/check.sh

      # Uploaded even when this shard's tests fail, so the coverage data
      # survives for diagnosis; the aggregate `checks` job still goes red.
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Fails if the shards do not partition the full collection exactly.
  shard-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read supported Python version
        id: runtime
        shell: bash
        run: |
          version="$(sed -n '1s/^python-//p' runtime.txt | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.runtime.outputs.version }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}

      - name: Restore virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.runtime.outputs.version }}-${{ hashFiles('requirements-lock.txt', 'scripts/bootstrap.sh') }}

      - name: Bootstrap development environment
        run: ./scripts/bootstrap.sh

      - name: Verify shards cover the suite exactly once
        run: .venv/bin/python scripts/verify_test_shards.py 3

  # Lint, format check, migrations and the demo database need no test
  # results, so they run beside the shards instead of after them.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECK_MODE: static
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read supported Python version
        id: runtime
        shell: bash
        run: |
          version="$(sed -n '1s/^python-//p' runtime.txt | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.runtime.outputs.version }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}

      - name: Restore virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.runtime.outputs.version }}-${{ hashFiles('requirements-lock.txt', 'scripts/bootstrap.sh') }}

      - name: Bootstrap development environment
        run: ./scripts/bootstrap.sh

      - name: Lint, migrate, validate demo database
        run: ./scripts/check.sh

  # Keeps the name of the required status check. It goes green only when every
  # shard, the partition check, the static job and the coverage floor all pass.
  checks:
    needs: [tests, shard-partition, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECK_MODE: coverage
      COVERAGE_DATA_DIR: ${{ github.workspace }}/coverage-data

    steps:
      - name: Require every upstream job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] != "success"}
          if bad:
              sys.exit(f"upstream jobs did not succeed: {bad}")
          '

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read supported Python version
        id: runtime
        shell: bash
        run: |
          version="$(sed -n '1s/^python-//p' runtime.txt | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.runtime.outputs.version }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}

      - name: Restore virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.runtime.outputs.version }}-${{ hashFiles('requirements-lock.txt', 'scripts/bootstrap.sh') }}

      - name: Bootstrap development environment
        run: ./scripts/bootstrap.sh

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage and enforce the floor
        run: ./scripts/check.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: statsplus
          POSTGRES_PASSWORD: statsplus
          POSTGRES_DB: statsplus_test
        ports:
          - 5432:5432
        # Docker runs the first health check one interval after the container
        # starts, so a short interval is what makes the job start promptly.
        options: >-
          --health-cmd "pg_isready -U statsplus"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read supported Python version
        id: runtime
        shell: bash
        run: |
          version="$(sed -n '1s/^python-//p' runtime.txt | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.runtime.outputs.version }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}

      - name: Restore virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.runtime.outputs.version }}-${{ hashFiles('requirements-lock.txt', 'scripts/bootstrap.sh') }}

      - name: Bootstrap development environment
        run: ./scripts/bootstrap.sh

      - name: Run Postgres integration tests
        # TEST_DATABASE_URL is deliberately separate from DATABASE_URL so these
        # destructive tests can never touch a real application database.
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://statsplus:statsplus@localhost:5432/statsplus_test
        run: .venv/bin/python -m pytest -m integration
