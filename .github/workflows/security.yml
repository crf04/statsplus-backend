name: Security

on:
  pull_request:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read supported Python version
        id: runtime
        shell: bash
        run: |
          version="$(sed -n '1s/^python-//p' runtime.txt | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The hosted image carries only the newest patch of each minor and has
      # no build of every older one, so restore the exact CPython as tests.yml does.
      - name: Restore Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Python/${{ steps.runtime.outputs.version }}
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Bootstrap locked environment
        run: ./scripts/bootstrap.sh

      - name: Scan locked dependencies
        run: .venv/bin/python -m pip_audit --local

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
