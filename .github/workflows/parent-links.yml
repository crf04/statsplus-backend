name: Parent links

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  parent-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A closing keyword aimed at crf04/statsplus would close the coordination
      # parent when this child merges, and a parent link with no issue here
      # leaves the child issue open; see docs/agents/issue-tracker.md there.
      - name: Close the child issue, never the coordination parent
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest test_check_parent_links
          python3 check_parent_links.py
