[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statsplus-residential-collector"
version = "0.1.0"
description = "Pull-only StatsPlus residential NBA observation collector"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nba_api>=1.11",
    "pandas>=2.0",
    "keyring>=24",
    "requests>=2.31",
]

[project.scripts]
statsplus-residential-collector = "statsplus_collector.cli:main"

[tool.setuptools]
packages = ["statsplus_collector"]
package-dir = {statsplus_collector = "app/collector"}

# Lets CI report coverage from shard data files combined in a separate job;
# the same measurement scripts/check.sh requests with --cov=app --cov-branch.
[tool.coverage.run]
source = ["app"]
branch = true
