      prizepicks: [PRA, Points + Rebounds + Assists, Pts+Rebs+Asts]
      underdog: [PRA, Points + Rebounds + Assists, Pts+Rebs+Asts, Pts + Rebs + Asts]
      novig: [POINTS_REBOUNDS_ASSISTS]
