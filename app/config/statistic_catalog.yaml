      underdog: [Steals]
      kalshi: [Steals]
      novig: [STEALS]
  - id: blocks
    market_category: BLK
    label: Blocks
    unit: count
    scoring_periods: [full_game]
    components: [blocks]
    provider_mappings:
      dabble: [blocks]
      prizepicks: [Blocks]
      underdog: [Blocks]
