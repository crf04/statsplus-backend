schema_version: 1
component_order:
  - points
  - rebounds
  - assists
  - three_pointers_made
  - steals
  - blocks
  - turnovers
  - field_goals_attempted
  - three_pointers_attempted
  - two_pointers_attempted
statistics:
  - id: points
    market_category: PTS
    label: Points
    unit: count
    scoring_periods: [full_game]
    components: [points]
    provider_mappings:
      dabble: [points]
      prizepicks: [Points]
      underdog: [Points]
      kalshi: [Points]
      polymarket: [points]
      novig: [POINTS]
  - id: rebounds
    market_category: REB
    label: Rebounds
    unit: count
    scoring_periods: [full_game]
    components: [rebounds]
    provider_mappings:
      dabble: [rebounds]
      prizepicks: [Rebounds]
      underdog: [Rebounds]
      kalshi: [Rebounds]
      polymarket: [rebounds]
      novig: [REBOUNDS]
  - id: assists
    market_category: AST
    label: Assists
    unit: count
    scoring_periods: [full_game]
    components: [assists]
    provider_mappings:
      dabble: [assists]
      prizepicks: [Assists]
      underdog: [Assists]
      kalshi: [Assists]
      polymarket: [assists]
      novig: [ASSISTS]
  - id: three_pointers_made
    market_category: 3PM
    label: Three-Pointers Made
    unit: count
    scoring_periods: [full_game]
    components: [three_pointers_made]
    provider_mappings:
      dabble: [three-pointers-made, threes, threes-made, 3PM]
      prizepicks: [3-Pointers Made, Three Pointers Made, 3PM]
      underdog: [3-Pointers Made, Three Pointers Made, 3PM]
      kalshi: [Three Pointers]
      novig: [THREE_POINTERS_MADE]
  - id: steals
    market_category: STL
    label: Steals
    unit: count
    scoring_periods: [full_game]
    components: [steals]
