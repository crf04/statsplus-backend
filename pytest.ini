[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --strict-config
markers =
    integration: needs a live Postgres database; skipped unless TEST_DATABASE_URL is set
filterwarnings =
    # Deprecations are shown by default so dependency rot stays visible.
    # Add narrow ignores here with a reason rather than silencing a whole category.
    # spaCy calls its own deprecated nlp.disable_pipes internally.
    ignore:\[W096\]:DeprecationWarning
