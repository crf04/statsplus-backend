[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not live"
markers =
    live: live provider contract tests (network); opt in with LIVE_CONTRACT_TESTS=true -m live
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning